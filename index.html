<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>攤位結帳</title>
    <style>
      :root{--bg:#f6f4ef;--card:#fff;--tx:#222;--sub:#777;--ac:#d9480f;--ln:#e3ded3;--ok:#2b8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
      @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#232328;--tx:#eee;--sub:#999;--ac:#ff8a4c;--ln:#3a3a42;--ok:#69db7c;color-scheme:dark}}
      :root[data-theme="dark"]{--bg:#17171a;--card:#232328;--tx:#eee;--sub:#999;--ac:#ff8a4c;--ln:#3a3a42;--ok:#69db7c;color-scheme:dark}
      html{scroll-padding-top:env(safe-area-inset-top,0px)}
      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:220px}
      header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
      h1{font-size:17px;margin:0}
      button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 10px;font-size:14px}
      button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
      #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:0 12px}
      .item{position:relative;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
      .item:active{transform:scale(.96)}
      .pic{height:36px;display:flex;align-items:center;justify-content:center;font-size:26px}
      .pic img{max-height:36px;max-width:100%;border-radius:6px;object-fit:cover}
      .nm{font-weight:600;font-size:14px;margin-top:2px}
      .pr{color:var(--sub);font-size:12px}
      .badge{position:absolute;top:4px;left:4px;background:var(--ac);color:#fff;border-radius:999px;min-width:24px;padding:2px 7px;font-size:14px;font-weight:700;pointer-events:none}
      .minus{position:absolute;top:2px;right:2px;width:32px;height:32px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:var(--card);color:var(--ac);border:1px solid var(--ac)}
      .add{border-style:dashed;color:var(--sub);display:flex;align-items:center;justify-content:center;min-height:96px;font-size:13px}
      #bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.12)}
      #lines{max-height:170px;overflow-y:auto;font-size:15px}
      .ln{display:flex;align-items:center;gap:10px;padding:4px 0}
      .ln button{min-width:48px;height:40px;padding:0;font-size:22px;line-height:1}
      .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px}
      .tot b{font-size:22px;color:var(--ac)}
      .row{display:flex;gap:8px;align-items:center;margin-top:4px}
      input{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
      #recv{flex:1}
      #chg{font-weight:700;color:var(--ok);min-width:90px;text-align:right}
      #ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
      #ov.on{display:flex}
      .box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:340px;display:grid;gap:8px}
      .box label{font-size:13px;color:var(--sub)}
      .cat{grid-column:1/-1;font-size:16px;font-weight:700;color:var(--ac);padding:8px 2px 2px;border-bottom:1px solid var(--ln)}
    </style>
  </head>
  <body>
    <header><h1>攤位結帳</h1><button id="editBtn">編輯菜單</button></header>
    <div id="grid"></div>
    <div id="bar">
      <div id="lines"></div>
      <div class="tot"><span>合計</span><b id="total">0</b></div>
      <div class="row"><input id="recv" type="number" inputmode="numeric" placeholder="收到金額"><span>找零</span><span id="chg">0</span></div>
      <div class="row"><button id="clr" style="flex:1">清空</button><button id="done" class="pri" style="flex:2">完成這筆</button></div>
    </div>
    <div id="ov">
      <div class="box">
        <label>品名</label><input id="fn">
        <label>價格</label><input id="fp" type="number" inputmode="numeric">
        <label>圖示（emoji）或上傳圖片</label>
        <input id="fe" maxlength="4" placeholder="🍜">
        <input id="ff" type="file" accept="image/*">
        <div class="row"><button id="fd">刪除</button>
          <button id="fc" style="margin-left:auto">取消</button>
          <button id="fs" class="pri">儲存</button>
        </div>
      </div>
    </div>
    <script>
      var KEY="stallpos.v1";
      var MENU_VER=2;
      var menu_pork = [
        { name: "排骨", price: 120, emoji: "🍲" },
        { name: "排骨+麵或泡飯(小)", price: 120, emoji: "🍲" },
        { name: "排骨+麵或泡飯(大)", price: 140, emoji: "🍲" },
        { name: "排骨+麵或泡飯(超大)", price: 160, emoji: "🍲" }
      ]
      var menu_fish = [
        { name: "魚蛋湯", price: 60,  emoji: "🍛" },
        { name: "魚蛋湯+麵或泡飯(小)", price: 80,  emoji: "🍛" },
        { name: "魚蛋湯+麵或泡飯(大)", price: 100, emoji: "🍛" },
        { name: "土虱(中、尾)",  price: 100, emoji: "🐟" },
        { name: "土虱+麵或泡飯(小)",  price: 120, emoji: "🐟" },
        { name: "土虱+麵或泡飯(大)",  price: 140, emoji: "🐟" }
      ]
      var menu_noodle = [
        { name: "麻油乾麵線", price: 40,  emoji: "🍚" },
        { name: "藥膳湯麵(小)", price: 60 },
        { name: "藥膳湯麵(大)", price: 80 }
      ]
      var menu_else = [
        { name: "瓜仔肉飯(小)", price: 30,  emoji: "🍚" },
        { name: "瓜仔肉飯(大)", price: 40,  emoji: "🍚" },
        { name: "小菜(小)", price: 35 },
        { name: "小菜(大)", price: 55 },
        { name: "燙青菜(小)", price: 40},
        { name: "燙青菜(大)", price: 60 }
      ];

      var categories = [
        { title: "排骨", list: menu_pork },
        { title: "魚類", list: menu_fish },
        { title: "麵類", list: menu_noodle },
        { title: "其他", list: menu_else }
      ];
      var items = [];
      var nextId = 1;
      categories.forEach(function (c) {
        c.list.forEach(function (m) {
          items.push(Object.assign({ id: nextId++, cat: c.title }, m));
        });
      });

      var cart={},edit=false,cur=null,img=null,today=0,count=0;

      try{
        var s=JSON.parse(localStorage.getItem(KEY)||"null");
        if(s){
          today=s.today||0;count=s.count||0;
          if(s.ver===MENU_VER) items=s.items||items; // 版本一致才沿用舊菜單
        }} catch(e){}

      function save(){
        try{
          localStorage.setItem(KEY,JSON.stringify({items:items,today:today,count:count,ver:MENU_VER}));
        } catch(e){}
      }

      function $(i){
        return document.getElementById(i);
      }

      function esc(t){
        return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});
      }

      function total(){
        var t=0;
        items.forEach(function(i){
          t+=(cart[i.id]||0)*i.price;
        });
        return t;
      }

      function dec(id){
        cart[id]--;
        if(cart[id]<=0)delete cart[id];
        render();
      }

      function render(){
        
        var h="",last=null;
        items.forEach(function(i){
          if(i.cat&&i.cat!==last){h+='<div class="cat">'+esc(i.cat)+'</div>';last=i.cat;}
          var q=cart[i.id]||0;
          h+='<div class="item" data-id="'+i.id+'">'+(q&&!edit?'<span class="badge">'+q+'</span><button class="minus" data-m="'+i.id+'">−</button>':'')+
          '<div class="pic">'+(i.img?'<img src="'+i.img+'" alt="">':esc(i.emoji||"🍽️"))+'</div><div class="nm">'+esc(i.name)+'</div><div class="pr">$'+i.price+(edit?' · 點擊編輯':'')+'</div></div>';
        });
        if(edit)h+='<div class="item add" data-id="new">＋ 新增品項</div>';
        $("grid").innerHTML=h;
        var l="";
        items.forEach(function(i){var q=cart[i.id]||0;if(q)l+='<div class="ln"><span class="n">'+esc(i.name)+' × '+q+'</span><span>$'+q*i.price+'</span><button data-m="'+i.id+'">−</button></div>';});
        $("lines").innerHTML=l||'<div style="color:var(--sub)">點上方品項加入</div>';
        $("total").textContent=total();
        chg();
        $("editBtn").textContent=edit?"完成編輯":"編輯菜單";
      }

      function chg(){
        var r=parseFloat($("recv").value);$("chg").textContent=isNaN(r)?0:Math.max(0,r-total());
      }

      $("grid").onclick=function(e){
        var m=e.target.closest(".minus");
        if(m){dec(+m.dataset.m);return;}
        var el=e.target.closest(".item");if(!el)return;var id=el.dataset.id;
        if(edit){openForm(id);return;}
        id=+id;cart[id]=(cart[id]||0)+1;render();
      };
      $("lines").onclick=function(e){var b=e.target.closest("button");if(!b)return;dec(+b.dataset.m);};
      $("recv").oninput=chg;
      $("clr").onclick=function(){cart={};$("recv").value="";render();};
      $("done").onclick=function(){var t=total();if(!t)return;today+=t;count++;save();cart={};$("recv").value="";render();$("done").textContent="已記錄（今日 $"+today+"／"+count+" 筆）";setTimeout(function(){$("done").textContent="完成這筆";},2500);};
      $("editBtn").onclick=function(){edit=!edit;render();};

      function openForm(id){
        cur=id;img=null;var it=items.filter(function(x){return String(x.id)===String(id);})[0]||{};
        $("fn").value=it.name||"";$("fp").value=it.price||"";$("fe").value=it.emoji||"";$("ff").value="";img=it.img||null;
        $("fd").style.display=it.id?"":"none";$("ov").classList.add("on");
      }

      $("fc").onclick=function(){$("ov").classList.remove("on");};

      $("ff").onchange=function(){
        var f=this.files[0];if(!f)return;var r=new FileReader();
        r.onload=function(){var im=new Image();im.onload=function(){
          var m=160,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
          c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.7);};im.src=r.result;};
        r.readAsDataURL(f);
      };

      $("fs").onclick=function(){
        var n=$("fn").value.trim(),p=parseFloat($("fp").value);if(!n||isNaN(p))return;
        var it;
        if (cur==="new") { 
          it={id:Date.now(),cat:"其他"};items.push(it);
        } else{
          it=items.filter(function(x){return String(x.id)===String(cur);})[0];
        }
        it.name=n;it.price=p;it.emoji=$("fe").value.trim();it.img=img;
        save();$("ov").classList.remove("on");render();
      };
      
      $("fd").onclick=function(){items=items.filter(function(x){return String(x.id)!==String(cur);});delete cart[cur];save();$("ov").classList.remove("on");render();};
      render();
    </script>
  </body>
</html>
